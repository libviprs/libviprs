resvg = { workspace = true, optional = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true, optional = true }
thiserror = { workspace = true }
tiff = { workspace = true }
