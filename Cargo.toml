# Root workspace (issue #151). Every crate in this repo is a member, so the
# repo has one lockfile and one [patch.crates-io] table. The fuzz crate used
# to be detached by its own empty [workspace] table, which gave it a private
# lockfile and silently dropped the pdfium-render fork patch.
[workspace]
members = ["fuzz"]
# Stated explicitly for clarity; this is already the edition-2024 default
# (MSRV-aware resolver v3), so resolution behavior is unchanged.
resolver = "3"

# Single-sourced version pins shared by every workspace member. Members
# inherit with `{ workspace = true }` so versions cannot drift per crate.
[workspace.dependencies]
# Pure-Rust TrueType glyph outlining and rasterisation (Apache-2.0), used by
# `Raster::text` with the bundled Bitstream Vera Sans face in `fonts/` (see
# `fonts/VERA-COPYRIGHT.TXT` for the font licence). Chosen over a Pango/Cairo
# binding to keep the crate pure Rust and the text output deterministic.
ab_glyph = "0.2"
arbitrary = { version = "1", features = ["derive"] }
blake3 = "1.8.4"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
libfuzzer-sys = "0.4"
libviprs = { path = "." }
loom = "0.7"
lopdf = "0.36"
# Pure-Rust ICC engine (BSD-3-Clause OR Apache-2.0) used by the colour
# operations for real ICC profile transforms (parse, matrix-shaper TRC +
# colorant evaluation, LUT pipelines). `any_to_any` enables the katana
# LUT engine so LUT-based (non-matrix-shaper) device profiles transform
# too, keeping icc_import honest for arbitrary profiles.
moxcms = { version = "0.8.1", features = ["any_to_any"] }
# Direct git dependency on the libviprs/pdfium-render fork, pinned to an
# immutable `rev` (the pin paragraph below) whose provenance is the
# consolidated `libviprs/integration` branch. That branch is the consolidated
# fork: it carries every one of our pdfium-render PRs (as though merged), so
# all fixes are single-sourced from one branch rather than one branch per PR.
# The headline fix is proper per-call thread-safety locking in
# `ThreadSafePdfiumBindings`. Upstream pdfium-render's wrapper (0.9.x on
# crates.io) acquires the pdfium global mutex only once on
# `FPDF_InitLibrary` and bypasses it for every other method, which
# segfaults under any concurrent access pattern when a single `Pdfium`
# instance is shared across threads (the common pattern when callers use a
# process-wide singleton). The fork rewrites every method to acquire the
# lock per-call. The consolidated fork tracks the 0.9.x upstream line, so
# the `version` requirement below is `^0.9`.
#
# This used to be a `[patch.crates-io]` entry, but a [patch] table only
# takes effect from the build root: consumers of libviprs (by git or
# path) silently resolved the unpatched registry wrapper unless they
# replicated the patch (issue #149). As a direct dependency the fork is
# an ordinary edge in the graph, so every git/path consumer inherits it
# with no [patch] hygiene required.
#
# The `version` key is a fallback for `cargo publish`: crates.io strips
# git sources, so the PUBLISHED libviprs still depends on the registry
# `pdfium-render ^0.9` and crates.io consumers still link the unpatched
# wrapper. libviprs's own FPDF calls stay safe there via the internal
# process-wide lock (`src/pdf.rs::pdfium_lock`), but the wrapper's
# `Send + Sync` remains unsound for direct use by crates.io consumers.
# PR #333 (which closed #286) deliberately descoped this published-crate
# soundness leg. The two real fixes — upstream the per-call locking
# (ajrcarey/pdfium-render#262) or publish the fork under a distinct crate
# name and depend on it by version — were the original #149 plan, which is
# now closed; the divergence is therefore carried as a known, accepted
# limitation and any renewed work is tracked under the PR #333 follow-up
# epic (#344), not #149.
#
# The `rev` below pins an exact commit SHA rather than a bare `branch`. A
# `branch` pin lets a force-push silently change the dependency on the next
# resolve, so builds would be non-reproducible; the `rev` fixes the resolved
# content and is behaviour-preserving — it is exactly the commit the lockfile
# already resolved from `libviprs/integration` (issue #286). Cargo forbids
# `branch` and `rev` on the same source, so the branch name lives here in
# prose as provenance and the `rev` is the actual pin.
#
# Caveat — the pin is content-stable, not GC-proof: reproducibility holds
# only while this commit stays REACHABLE from an advertised ref on the
# remote. GitHub serves a bare SHA to Cargo only when it is reachable from
# some ref (allowReachableSHA1InWant is on, allowAnySHA1InWant is off), so if
# `libviprs/integration` is force-pushed/rebased past this commit and GitHub
# GCs it, a cold-cache `cargo fetch` hard-fails to find the rev. Durability
# therefore still rests on the mutable branch keeping the commit reachable;
# anchoring to an immutable ref (an annotated tag on a protected tag ref that
# is never force-pushed) or publishing the fork as a renamed versioned crate
# is the deeper fix, tracked under #344. When intentionally advancing the
# fork, fast-forward the branch and update this `rev` to the new head in
# lockstep.
pdfium-render = { version = "0.9", features = [
	"sync",
], git = "https://github.com/libviprs/pdfium-render.git", rev = "1000a1aff1888425004c11432b376d2c36a4d3f2" }
proptest = "1"
# Pure-Rust FFT (MIT OR Apache-2.0) used by the frequency-domain filter
# operations in `src/freqfilt.rs` (`fwfft`, `invfft`, `freqmult`, `spectrum`,
# `phasecor`). Chosen over an FFTW binding to keep the crate pure Rust; its
# mixed-radix planner (with Bluestein fallback) handles every image size, not
# just powers of two, matching what libvips gets from FFTW.
rustfft = "6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tar = "0.4.45"
tempfile = "3"
thiserror = "2"
# Pure-Rust TIFF codec (MIT). It is already in the dependency graph
# transitively through the `image` crate's `tiff` feature; the TIFF lane
# promotes it to a direct dependency because the `image` facade does not
# expose two things the lane needs: per-image compression selection
# (Uncompressed / LZW / Deflate) on the encode side, and multi-page IFD
# navigation (page count, decode-nth-page) on the decode side. Only the
# `lzw` and `deflate` features are declared, the exact codecs the encoder
# drives; feature unification with `image` (which pulls the crate's full
# default set) keeps the decoder able to read fax/jpeg pages at runtime.
tiff = { version = "0.10.3", default-features = false, features = [
	"lzw",
	"deflate",
] }
tracing = "0.1"
# Test-only subscriber used by `tests/tracing_tile_spans.rs` to capture the
# per-tile span tree the `tracing` feature emits (issue #83). It is a
# dev-dependency only, so it never links into the library or its consumers;
# the default build stays byte-identical.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
zip = "7.2.0"

[package]
name = "libviprs"
version = "0.4.0"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
rust-version = "1.85"
description = "Pure-Rust tile pyramid engine for blueprint PDFs and large rasters: monolithic, streaming, and parallel MapReduce engines behind a fluent EngineBuilder API. DeepZoom, XYZ, and Google layouts; bounded-memory rendering; resume, retry, and dedupe."
license = "MIT"
repository = "https://github.com/libviprs/libviprs"
homepage = "https://libviprs.org"
keywords = ["image", "pyramid", "tiles", "deepzoom", "pdf"]
categories = ["multimedia::images", "graphics"]
readme = "README.md"

# Build docs.rs with every feature enabled and the `docsrs` cfg set, so the
# hosted documentation renders the feature-gated surface (render_page_pdfium,
# PdfiumStripSource, ObjectStoreSink, PackfileSink) with feature badges instead
# of advertising it as broken intra-doc links (issue #146).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
deprecated = "deny"

[lints.clippy]
incompatible_msrv = "warn"

[features]
default = []
pdfium = ["dep:pdfium-render"]
pdfium-static = ["pdfium", "pdfium-render/static"]
# `object-store-sink` gates the ObjectStoreSink module. The in-tree sink uses a
# hand-rolled `ObjectStore` trait and is wired for user-injected backends: it
# pulls in no extra crates and ships no built-in S3 transport (a real
# object_store + tokio client will land in a follow-up PR). The name reflects
# that the module is a generic object-store sink requiring an injected backend,
# not a ready-to-use S3 client.
object-store-sink = []
# Documentation-only deprecated alias for `object-store-sink`. Cargo has no
# mechanism to mark a feature deprecated, so enabling `s3` emits NO build-time
# warning: consumers pinned to `features = ["s3"]` get zero automated signal
# and must migrate by hand. The alias is retained purely so those consumers
# keep building and is exactly equivalent to `object-store-sink` (it enables
# nothing else). Prefer `object-store-sink` in new code; the `s3` alias will
# be removed in a future release, which will be a breaking change for anyone
# still enabling it.
s3 = ["object-store-sink"]
tracing = ["dep:tracing"]
packfile = ["dep:tar", "dep:zip"]
# Gates public `Serialize` / `Deserialize` derives on the wire/config types
# (`PyramidPlan`, `LevelPlan`, `TileCoord`, `TileRect`, `Layout`,
# `EngineConfig`, `BlankTileStrategy`, `FailurePolicy`, `RetryPolicy`,
# `DedupeStrategy`, `WorkerId`) so out-of-process callers can reconstruct a
# job from a JSON envelope (issue #67). The serde crate itself is already a
# required dependency (resume checkpoints and packfile manifests use it
# internally), so this feature adds no dependencies; it only widens the
# public API surface, keeping the default build's API unchanged.
serde = []
# Exposes the crate's test-only sink doubles (currently `SlowSink`, a sink that
# sleeps in `write_tile` to exercise engine backpressure/timing) to *dependent*
# crates — chiefly the external `libviprs-tests` stress suite. These doubles are
# compiled for the crate's own unit tests unconditionally (via `cfg(test)`), but
# a dependent crate never sees `cfg(test)`, so this feature is what makes them
# reachable there. They are intentionally kept out of the default public API:
# production callers have no use for a sink that deliberately sleeps, and
# shipping it unconditionally invites accidental use. Adds no dependencies.
test-util = []

[dependencies]
ab_glyph = { workspace = true }
blake3 = { workspace = true }
flate2 = { workspace = true }
image = { workspace = true }
lopdf = { workspace = true }
moxcms = { workspace = true }
pdfium-render = { workspace = true, optional = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true, optional = true }
thiserror = { workspace = true }
tiff = { workspace = true }
tracing = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
loom = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
