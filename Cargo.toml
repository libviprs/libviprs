# Root workspace (issue #151). Every crate in this repo is a member, so the
# repo has one lockfile and one [patch.crates-io] table. The fuzz crate used
# to be detached by its own empty [workspace] table, which gave it a private
# lockfile and silently dropped the pdfium-render fork patch.
[workspace]
members = ["fuzz"]
# Stated explicitly for clarity; this is already the edition-2024 default
# (MSRV-aware resolver v3), so resolution behavior is unchanged.
resolver = "3"

# Single-sourced version pins shared by every workspace member. Members
# inherit with `{ workspace = true }` so versions cannot drift per crate.
#
# Before adding an entry here, read the dependency rule in CONTRIBUTING.md.
# The short version: nothing this crate builds may need a library that is not
# already in the dependency tree. Vendored C compiled through a `build.rs` is
# fine, discovering or linking an installed library is not, and neither a
# `build.rs` nor a `links =` key nor a `-sys` suffix is what decides which is
# which. `tests/dependency_policy.rs` enforces the two mechanical clauses (no
# discovering a library on the build machine, no compiling native source that
# did not come down with the crate), so a new dependency breaking either fails
# the suite rather than review. The third clause, no linking or loading a
# library somebody has to install first, has no mechanical check and cannot
# have one: `pdfium-render` ships no C, declares no `links` key and still needs
# a libpdfium. Check that one by hand against the checklist in CONTRIBUTING.md.
[workspace.dependencies]
# Pure-Rust TrueType glyph outlining and rasterisation (Apache-2.0), used by
# `Raster::text` with the bundled Bitstream Vera Sans face in `fonts/` (see
# `fonts/VERA-COPYRIGHT.TXT` for the font licence). Chosen over a Pango/Cairo
# binding to keep the crate pure Rust and the text output deterministic.
ab_glyph = "0.2"
arbitrary = { version = "1", features = ["derive"] }
blake3 = "1.8.4"
# Pure-Rust OpenEXR codec (BSD-3-Clause), used by `decode_exr` to stand in
# for the OpenEXR C++ library vips loads `.exr` through. Named directly
# rather than reached through `image`'s `exr` feature (which is exactly
# `dep:exr`, so the crate cost is identical either way) for the same reason
# `tiff` and `image-webp` are named directly: the facade flattens every file
# to one of its fixed colour types, and an EXR is an arbitrary set of named
# channels. The direct API reports the channel list, the per-channel sample
# type, the data window and the display window, none of which survive
# `image::DynamicImage`.
#
# `default-features = false` drops the single default feature, `rayon`, which
# only enables `rayon-core` for parallel block decompression. libviprs does
# its own scheduling in the engine and a codec that spawns a second thread
# pool underneath it is not something this crate wants. It buys no lockfile
# reduction: `rayon` is already in the graph through `lopdf`, so this is
# purely about who owns the threads at decode time.
#
# `pulp` is not optional in `exr` and cannot be dropped. It is the SIMD
# abstraction `faer` is built on, pure Rust with no `-sys` crate and no
# `links =` key, but it is not `forbid(unsafe_code)` the way `exr` itself
# is, and on x86_64 its `build.rs` generates a `core::arch::global_asm!`
# block (it returns early on every other architecture). No C compiler and
# no external system library are involved either way, which is the bar
# CONTRIBUTING.md sets.
exr = { version = "1.74.2", default-features = false }
flate2 = "1"
# The GIF codec, taken directly rather than only through the `image` facade
# (issue #499). `image`'s `GifEncoder` exposes `new`, `new_with_speed`,
# `set_repeat`, `encode`, `encode_frame(s)` and nothing else: measured on
# `image` 0.25.10's `codecs/gif.rs`, zero occurrences of "interlac" and zero
# of "dither", and `encode` routes straight to `Frame::from_rgb_speed` with
# no palette control, so none of `gifsave`'s three headline options is
# reachable there. `gif::Frame::interlaced` (`common.rs:155`) and
# `from_indexed_pixels` are. Taking both is free in lockfile terms: the
# `image` `gif` feature already pulls this exact crate, so there is no new
# node in the graph.
#
# `default-features = false` ALONE COMPILES TO AN EMPTY CRATE:
# `gif-0.14.2/src/lib.rs:113` is a crate-level `#![cfg(feature = "std")]`.
# The `std` feature is not optional here, it is the whole library.
gif = { version = "0.14", default-features = false, features = ["std"] }
# Pure-Rust JPEG 2000 decoder (MIT OR Apache-2.0), the load half of issue
# #501. It is the cheapest codec dependency in this manifest by a wide
# margin: with `default-features = false` it has **no dependencies at all**,
# so it is +1 lock entry against `svg`'s +29 and `jxl`'s +21, and it is
# `#![forbid(unsafe_code)]` on top of that.
#
# Chosen over the three C routes (`openjpeg-sys`, and `jpeg2k` / `jp2k` /
# `jpeg2000` which wrap it) because epic #520's premise is a format wave
# reachable without new heavy C dependencies, and over `openjp2` (a c2rust
# port of OpenJPEG, 422 `unsafe` blocks) because this one reads untrusted
# bytes. Measured against the 27 fixtures in `oracle-captures/foreign-jp2k`:
# it decodes all 22 valid ones and refuses all 5 malformed ones with a typed
# error, which is the same verdict `vips jp2kload` gives on each.
#
# `default-features = false` drops `simd`, `image` and `logging`. `simd` is
# the interesting one: it pulls `fearless_simd` (+1 more entry) and is the
# crate's ONLY source of unsafe, its own docs saying that turning it off
# "eliminate[s] any usage of unsafe in this crate as well as its
# dependencies". A JPEG 2000 decoder eats untrusted bytes, so this build
# takes the safe one and pays the speed. `image` would pull `moxcms` into
# the decoder to colour-manage internally, and colour management here
# belongs to `crate::colour`, not to a loader.
hayro-jpeg2000 = { version = "0.4.0", default-features = false, features = [
    "std",
] }
# Pure-Rust codec facade. The feature list is the crate's decodable
# format set, and it is edited here once for the whole format wave
# (issue #563) rather than once per lane: every feature added recompiles
# the 36k-LOC crate, so batching the change is measurably cheaper than
# three separate edits, and it keeps four lanes off one conflicting line.
# `hdr` is deliberately absent. The crate decodes RGBE as
# `mantissa * 2^(e-136)` where vips uses the half-bit-centred
# `(mantissa + 0.5) * 2^(e-136)`, a 100% error at mantissa 0, so it was
# never usable for parity (#506 hand-rolls its own decoder). Leaving the
# feature off is also what keeps the #539 RLE multiply overflow in
# `codecs/hdr/decoder.rs` unreachable.
image = { version = "0.25", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
# The WebP codec `image` already pulls in behind its `webp` feature, named
# directly (issue #568). Promoting it costs no new crate and no lockfile
# churn: `image` 0.25 depends on `image-webp = "0.2.0"`, so `"0.2.4"`
# resolves to the one copy that is already in the graph. The reason to name
# it is the encoder surface. `image::codecs::webp::WebPEncoder` exposes
# `new_lossless` plus `ImageEncoder`'s ICC and EXIF setters and stops there,
# where `image_webp::WebPEncoder` also has `set_xmp_metadata`, and XMP is one
# of the three chunks vips `webpsave --keep` round-trips. The decoder is the
# same story: only the direct type reports `num_frames()`, which is what
# libviprs attaches as `n-pages`.
image-webp = "0.2.4"
# Pure-Rust JPEG XL decoder (MIT OR Apache-2.0), the load half of issue #500.
# It is the only maintained pure-Rust JXL decoder, it targets the same
# JPEG XL conformance suite libjxl does, and the thirteen `jxl-*` crates it
# pulls need nothing installed on the machine: no `-sys` crate, no `links =`
# key, no C compiled anywhere in the added set.
#
# `default-features = false` drops `rayon`, which is the whole of the crate's
# default feature set (`default = ["rayon"]`, forwarded to
# `jxl-threadpool/rayon`). libviprs does its own scheduling in the engine, so
# a second work-stealing pool inside the decoder would fight it. The
# `image`, `lcms2` and `moxcms` integration features stay off too: `moxcms`
# would let the decoder colour-manage internally, and colour management in
# this crate belongs to `crate::colour`, not to a loader.
#
# The lower bound is a SECURITY FLOOR, not a taste. GHSA-66m8-c62j-h6v5:
# `FrameBuffer::new` multiplies `width * height * channels` as unchecked
# `usize`, so an overflow builds an undersized buffer whose safe grouped
# accessors then hand out oversized slices. 0.12.6 is the fix and every
# release at or below 0.12.5 is affected. Same kind of pin, and the same
# reason, as `resvg` at 0.48.1 below.
#
# It is a floor and NOT an `=` pin, which is a decision worth the paragraph
# because the obvious reading of the MSRV hazard says otherwise. jxl-oxide
# declares no `rust-version`, so the MSRV-aware resolver (v3, set above)
# cannot keep `cargo +1.97 check` honest for it: a patch release is free to
# raise the real floor with nothing to declare it. But MEASURED, none of the
# thirteen `jxl-*` crates declares one either, and jxl-oxide requires its
# siblings by caret, so `=0.12.6` would freeze one crate out of thirteen
# while `jxl-frame`, `jxl-render` and the rest kept floating. That is not
# protection, it is the appearance of it, and it would additionally break
# any consumer who separately depends on `jxl-oxide ^0.12.7`, because `=`
# cannot unify upward.
#
# So the hazard is real and it is carried by the gate instead: `Cargo.lock`
# is not committed here, so CI resolves fresh on every push and runs
# `cargo +1.97 check --all-targets --features jxl`. A family-wide MSRV bump
# therefore shows up as a red build within a day rather than in a consumer's
# lockfile. The feature name in that command is load-bearing, because these
# crates are optional: without it they are not in the graph and the job would
# check nothing. The real fix, if a hard freeze is ever wanted, is a committed
# lockfile, not an `=` on the root of the tree.
jxl-oxide = { version = "0.12.6", default-features = false }
# One type out of `jxl-oxide`'s own tree, named directly because it is the
# only way to tell an allocation-budget refusal from a corrupt bitstream:
# the `AllocTracker` `crate::jxl` hands the decoder reports a refusal as a
# `jxl_grid::OutOfMemory`, boxed behind `jxl_render::Error::Buffer` or
# `jxl_frame::Error::Buffer`, and `jxl-oxide` re-exports `AllocTracker` but
# not the error. Costs no lock entry: `jxl-oxide` already depends on this
# exact version, and the requirement here unifies with it.
jxl-grid = "0.6.2"
libfuzzer-sys = "0.4"
libviprs = { path = "." }
loom = "0.7"
lopdf = "0.36"
# Pure-Rust ICC engine (BSD-3-Clause OR Apache-2.0) used by the colour
# operations for real ICC profile transforms (parse, matrix-shaper TRC +
# colorant evaluation, LUT pipelines). `any_to_any` enables the katana
# LUT engine so LUT-based (non-matrix-shaper) device profiles transform
# too, keeping icc_import honest for arbitrary profiles.
moxcms = { version = "0.8.1", features = ["any_to_any"] }
# Pure-Rust translation of OpenJPEG's libopenjp2 (BSD-2-Clause), the save
# half of issue #501. Also +1 lock entry: it has no dependencies either.
#
# It is here for the encoder and nothing else; `crate::jp2k` decodes through
# `hayro-jpeg2000` above. That split is `crate::jxl`'s exactly, where
# `jxl-oxide` decodes and `zune-jpegxl` encodes, and it is drawn on the same
# line: the crate that reads attacker-controlled bytes is the one with
# `forbid(unsafe_code)`, and the encoder only ever sees a `Raster` this
# crate already owns.
#
# The three alternatives were measured rather than reasoned about, because
# JPEG 2000 encoders that write a plausible container and a wrong codestream
# are common:
#
# * `justjp2` 0.1.1 is 0 `unsafe` and looks ideal until you run it. Its own
#   `lossless: true` round trip is NOT lossless (measured: ±2 counts on an
#   8-bit ramp), `hayro-jpeg2000` refuses its output with
#   `InvalidBitplaneCount`, and OpenJPEG 2.5.4 through `vips jp2kload`
#   decodes it to a flat mid-grey, every coefficient gone. Three decoders,
#   three different answers, one of them itself.
# * `pure_jpeg2k` 2.0.0 encodes one unsigned 16-bit component, one tile,
#   which is neither RGB nor CMYK nor 8-bit, so it cannot stand in for
#   `jp2ksave` at all.
# * `openjp2` 0.6.1 encodes correctly but its only in-memory stream
#   constructor is `Stream::new_custom`, whose read/write/skip/seek hooks are
#   raw `extern "C"` function pointers over `*mut c_void`. The safe
#   `StreamInner::new_writer` is `pub(crate)`. Taking it would have put the
#   first `unsafe` block in `src/` into this crate, which today has none.
#
# This one's `Encoder::encode(&Image, &EncodeOptions) -> Result<Vec<u8>>` is
# safe, in-memory and needs no callbacks, and its output is verified against
# the reference C rather than trusted: measured, `vips jp2kload` (linking
# libopenjp2 2.5.4) reads back what it writes **bit for bit** for 8-bit RGB,
# 16-bit greyscale and 4-band CMYK. The `unsafe` inside it (269 sites, a
# faithful translation of the C) stays inside it.
openjpeg2-pure = { package = "openjpeg2-pure-rs", version = "0.1.1" }
# Direct git dependency on the libviprs/pdfium-render fork, pinned to an
# immutable `rev` (the pin paragraph below) whose provenance is the
# consolidated `libviprs/integration` branch. That branch is the consolidated
# fork: it carries every one of our pdfium-render PRs (as though merged), so
# all fixes are single-sourced from one branch rather than one branch per PR.
# The headline fix is proper per-call thread-safety locking in
# `ThreadSafePdfiumBindings`. Upstream deleted that bindings layer in
# 0.9.0, on the assumption that stashing the bindings in a global
# `OnceCell` had made it redundant, so 0.9.0 through 0.9.3 on crates.io
# serialise nothing past library init while still marking `Pdfium` as
# `Send + Sync` under `thread_safe`. That segfaults under any concurrent
# access pattern when a single `Pdfium` instance is shared across threads
# (the common pattern when callers use a process-wide singleton), and is
# filed as ajrcarey/pdfium-render#262. The fork restores the per-call
# lock on every method. The consolidated fork tracks the 0.9.x upstream
# line, so the `version` requirement below is `^0.9`.
#
# This used to be a `[patch.crates-io]` entry, but a [patch] table only
# takes effect from the build root: consumers of libviprs (by git or
# path) silently resolved the unpatched registry wrapper unless they
# replicated the patch (issue #149). As a direct dependency the fork is
# an ordinary edge in the graph, so every git/path consumer inherits it
# with no [patch] hygiene required.
#
# The `version` key is a fallback for `cargo publish`: crates.io strips
# git sources, so the PUBLISHED libviprs depends on the registry
# `pdfium-render ^0.9`, not on this fork.
#
# That is why the feature list has to name features BOTH sources have,
# and why it says `thread_safe` rather than `sync`. `sync` was never a
# fork capability: upstream 0.8.x carried it as a plain alias
# (`sync = ["thread_safe"]`) and deleted it in 0.9.0, and the fork only
# re-added it as a synonym so downstream manifests kept building. When
# this entry moved from `version = "0.8"` to `version = "0.9"` the
# feature name did not move with it, so every git-resolved build went on
# working through the fork's synonym while `cargo publish`, the one
# resolver that sees the registry crate, hard-failed with "pdfium-render
# does not have that feature" (issue #981). Requesting `thread_safe`
# directly is the same feature set for the fork and a name the registry
# crate actually has.
#
# What that does NOT fix is soundness for crates.io consumers, and it is
# worse than the old comment here claimed. Registry `pdfium-render`
# 0.9.0 through 0.9.3 deleted `src/bindings/thread_safe.rs` outright, so
# on the registry `thread_safe` gates a bare `unsafe impl Send + Sync for
# Pdfium` with no serialisation at all: ajrcarey/pdfium-render#262.
# libviprs's own FPDF calls stay safe either way through the internal
# process-wide lock (`src/pdf.rs::pdfium_lock`), but a crates.io consumer
# touching `pdfium-render` directly would get the unsound wrapper. The
# published 0.3.1 predates this: it depends on `^0.8`, where the per-call
# locking bindings still shipped, so it is sound and is the newest sound
# release until this is fixed.
#
# Upstream has already reinstated the per-call locking bindings on master
# and has said they ship in 0.9.4, so the fix is to raise the requirement
# below from `0.9` to `0.9.4` once that release exists. Doing that also
# clears the guard step in `.github/workflows/publish.yml`, which refuses
# a real upload while the floor is lower. PR #333 (which closed #286)
# descoped this published-crate soundness leg to #149, which was already
# closed, and the follow-up epic #344 is closed too, so #981 is the live
# tracker.
#
# The `rev` below pins an exact commit SHA rather than a bare `branch`. A
# `branch` pin lets a force-push silently change the dependency on the next
# resolve, so builds would be non-reproducible; the `rev` fixes the resolved
# content and is behaviour-preserving — it is exactly the commit the lockfile
# already resolved from `libviprs/integration` (issue #286). Cargo forbids
# `branch` and `rev` on the same source, so the branch name lives here in
# prose as provenance and the `rev` is the actual pin.
#
# Caveat — the pin is content-stable, not GC-proof: reproducibility holds
# only while this commit stays REACHABLE from an advertised ref on the
# remote. GitHub serves a bare SHA to Cargo only when it is reachable from
# some ref (allowReachableSHA1InWant is on, allowAnySHA1InWant is off), so if
# `libviprs/integration` is force-pushed/rebased past this commit and GitHub
# GCs it, a cold-cache `cargo fetch` hard-fails to find the rev. Durability
# therefore still rests on the mutable branch keeping the commit reachable;
# anchoring to an immutable ref (an annotated tag on a protected tag ref that
# is never force-pushed) or publishing the fork as a renamed versioned crate
# is the deeper fix, tracked under #981. When intentionally advancing the
# fork, fast-forward the branch and update this `rev` to the new head in
# lockstep.
pdfium-render = { version = "0.9", features = [
	"thread_safe",
], git = "https://github.com/libviprs/pdfium-render.git", rev = "3b03093295b85486c2e42f514cef9647eb629c63" }
proptest = "1"
# Pure-Rust FFT (MIT OR Apache-2.0) used by the frequency-domain filter
# operations in `src/freqfilt.rs` (`fwfft`, `invfft`, `freqmult`, `spectrum`,
# `phasecor`). Chosen over an FFTW binding to keep the crate pure Rust; its
# mixed-radix planner (with Bluestein fallback) handles every image size, not
# just powers of two, matching what libvips gets from FFTW.
rustfft = "6"
# Pure-Rust SVG rasteriser (Apache-2.0 OR MIT), used by the `svg` feature's
# `decode_svg` to stand in for the librsvg + cairo pair vips loads SVG
# through. Chosen for the same reason as every other codec here: it keeps
# the crate pure Rust, and it is the only maintained pure-Rust renderer with
# a real SVG 1.1 static-subset implementation behind it.
#
# Pinned at 0.48.1 on purpose, not floated. 0.47.x shapes text through
# `rustybuzz` and parses faces with `ttf-parser`, both RUSTSEC-flagged
# unmaintained (RUSTSEC-2026-0206, RUSTSEC-2026-0192); 0.48 is the release
# that moved to `harfrust` and `skrifa`, so the lower bound is a security
# floor rather than a taste.
#
# `default-features = false` drops `system-fonts` and `raster-images`.
# Dropping `system-fonts` is deliberate and permanent: resolving faces from
# whatever happens to be installed would make rasterised output depend on
# the machine, which is the one thing a parity crate cannot have. `text` is
# kept so text-bearing documents render against the bundled face in `fonts/`
# instead of silently rendering as nothing (issue #587 characterises how far
# that lands from vips). The whole dependency sits behind the non-default
# `svg` feature, so the +29 crates are opt-in.
# Pure-Rust AV1 decoder (BSD-2-Clause), a port of dav1d, used by
# `decode_avif` behind the `avif` feature. It is the only AV1 decoder that
# clears CONTRIBUTING.md's dependency rule: `image`'s own AVIF decode feature
# is `avif-native`, which is `dav1d-sys` and needs a libdav1d installed on the
# machine (clause 2), and `libavif-sys` is the same shape. `image`'s `avif`
# feature is encode-only and is not what this needs.
#
# `default-features = false` drops `asm`, which is what keeps this inside the
# rule. With `asm` on, `build.rs` runs `nasm-rs` on x86_64, and `nasm` is an
# assembler somebody has to install; with it off the whole `mod asm` in that
# build script is `#[cfg(feature = "asm")]` and nothing native is compiled at
# all. Measured, with a positive control: a debug build of this crate emits
# zero `.o` and zero `.a` files under `target/debug/build/rav1d-*`, while
# `blake3` in the same tree emits `blake3_neon.o` and `libblake3_neon.a`.
# `cc` and `nasm-rs` are still unconditional build-dependencies of `rav1d` and
# so are still lock entries; `cc` is free (CONTRIBUTING.md notes it is in
# every graph on every target already) and `nasm-rs` is dormant, the same
# shape as `pkg-config` under `packfile`.
#
# `bitdepth_8` and `bitdepth_16` have to be named explicitly. They are default
# features, so `default-features = false` turns them BOTH off, and without
# them `rav1d` compiles but can decode nothing. The 10- and 12-bit fixtures in
# `oracle-captures/foreign-avif` are what need `bitdepth_16`.
#
# MSRV is fine: `rav1d` declares `rust-version = "1.79"`, well under this
# crate's 1.97.
rav1d = { version = "1.1", default-features = false, features = [
	"bitdepth_8",
	"bitdepth_16",
] }
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tar = "0.4.45"
tempfile = "3"
thiserror = "2"
# Pure-Rust TIFF codec (MIT). It is already in the dependency graph
# transitively through the `image` crate's `tiff` feature; the TIFF lane
# promotes it to a direct dependency because the `image` facade does not
# expose two things the lane needs: per-image compression selection
# (Uncompressed / LZW / Deflate) on the encode side, and multi-page IFD
# navigation (page count, decode-nth-page) on the decode side. Only the
# `lzw` and `deflate` features are declared, the exact codecs the encoder
# drives; feature unification with `image` (which pulls the crate's full
# default set) keeps the decoder able to read fax/jpeg pages at runtime.
tiff = { version = "0.10.3", default-features = false, features = [
	"lzw",
	"deflate",
] }
# Structural TOML parsing (MIT OR Apache-2.0), used by
# `tests/unsafe_inventory.rs` to read `Cargo.toml`'s own `[features]` table
# instead of a hand-rolled line-based parser (issue #968: that hand-rolled
# parser was a strict superset in complexity of the simpler line-grep #949
# proved insufficient, on code that gates whether `unsafe` FFI enters a
# default build). Dev-only, so it never links into the library or its
# consumers.
toml = "0.8"
tracing = "0.1"
# Test-only subscriber used by `tests/tracing_tile_spans.rs` to capture the
# per-tile span tree the `tracing` feature emits (issue #83). It is a
# dev-dependency only, so it never links into the library or its consumers;
# the default build stays byte-identical.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
zip = "7.2.0"
# Pure-Rust JPEG XL encoder (MIT OR Apache-2.0 OR Zlib), the save half of
# issue #500, optional behind the `jxl` feature. It is
# `#![forbid(unsafe_code)]` from its crate root down and brings exactly one
# crate with it, `zune-core`, which the default build already has.
#
# It encodes ONE corner of the format: lossless modular, 8- or 16-bit, one to
# four channels. There is no VarDCT path in it, so `jxlsave`'s `distance`,
# `Q`, `tier` and `effort` have no backing here and therefore no spelling in
# [`crate::jxl::SaveOptions`]; see that module for why an ignored quality
# argument was the one option worth refusing outright.
#
# `default-features = false, features = ["std"]` drops `threads`, which is
# the only other default. Dropping it keeps the encoder single-threaded, for
# the same reason `jxl-oxide` drops `rayon`: the engine above owns the
# scheduling. `std` is kept because libviprs is a std crate and the feature
# is what gives the encoder `std::error::Error`.
zune-jpegxl = { version = "0.5.2", default-features = false, features = [
	"std",
] }
# `zune-jpegxl`'s own vocabulary types, named directly because that crate
# re-exports none of them: `JxlSimpleEncoder::new` takes an
# `EncoderOptions`, which carries a `ColorSpace` and a `BitDepth`, and all
# three live here. It costs no lock entry, because `image`'s `jpeg` feature
# already pulls `zune-jpeg`, which already pulls this exact crate.
#
# `default-features = false` is the crate's own default (its only feature
# set is `std`, `log` and `serde`, none of them on by default). Leaving
# `std` off keeps the dependency edge minimal; feature unification with
# `zune-jpeg` decides what actually gets compiled, and both spellings of
# `ZByteWriterTrait` accept the `&mut Vec<u8>` sink the encoder writes into.
#
# Optional only so `crate::jxl` can name it behind the `jxl` feature. It costs
# nothing either way: `image` depends on it directly and `zune-jpeg` and `tiff`
# reach it too, so it is in the graph of a default build with the feature off.
zune-core = { version = "0.5.1", default-features = false }

[package]
name = "libviprs"
version = "0.4.0"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
rust-version = "1.97"
description = "Pure-Rust tile pyramid engine for blueprint PDFs and large rasters: monolithic, streaming, and parallel MapReduce engines behind a fluent EngineBuilder API. DeepZoom, XYZ, and Google layouts; bounded-memory rendering; resume, retry, and dedupe."
license = "MIT"
repository = "https://github.com/libviprs/libviprs"
homepage = "https://libviprs.org"
keywords = ["image", "pyramid", "tiles", "deepzoom", "pdf"]
categories = ["multimedia::images", "graphics"]
readme = "README.md"

# Build docs.rs with every feature enabled and the `docsrs` cfg set, so the
# hosted documentation renders the feature-gated surface (render_page_pdfium,
# PdfiumStripSource, ObjectStoreSink, PackfileSink) with feature badges instead
# of advertising it as broken intra-doc links (issue #146).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
deprecated = "deny"

[lints.clippy]
incompatible_msrv = "warn"

[features]
default = []
pdfium = ["dep:pdfium-render"]
pdfium-static = ["pdfium", "pdfium-render/static"]
# `object-store-sink` gates the ObjectStoreSink module. The in-tree sink uses a
# hand-rolled `ObjectStore` trait and is wired for user-injected backends: it
# pulls in no extra crates and ships no built-in S3 transport (a real
# object_store + tokio client will land in a follow-up PR). The name reflects
# that the module is a generic object-store sink requiring an injected backend,
# not a ready-to-use S3 client.
object-store-sink = []
# Documentation-only deprecated alias for `object-store-sink`. Cargo has no
# mechanism to mark a feature deprecated, so enabling `s3` emits NO build-time
# warning: consumers pinned to `features = ["s3"]` get zero automated signal
# and must migrate by hand. The alias is retained purely so those consumers
# keep building and is exactly equivalent to `object-store-sink` (it enables
# nothing else). Prefer `object-store-sink` in new code; the `s3` alias will
# be removed in a future release, which will be a breaking change for anyone
# still enabling it.
s3 = ["object-store-sink"]
tracing = ["dep:tracing"]
# Gates the SVG rasteriser in [`crate::svg`] and the real body of
# `decode_svg`. Non-default because it is one of the two features in the crate
# that cost a meaningful number of dependencies (`jxl` below is the other):
# +29 lock entries for `resvg` and its tree. Every one of them is pure Rust
# with no `build.rs` C compile and no `-sys` crate, so enabling it does not put
# a C toolchain in the build, but nobody who does not rasterise SVG should pay
# for the compile.
# Gates the AVIF still-image loader in [`crate::avif`] and the real body of
# the AV1 decode inside `decode_avif`. With the feature off the entry point
# still exists, still compiles and keeps its signature, and still runs the
# container parse, the codec check and all three decode limits; only the AV1
# decode itself is missing, and it reports that as a typed refusal the way
# `crate::jxl` does without `jxl`.
#
# Non-default for the same reason as `svg` and `jxl` above, and it is the
# cheapest of the three: +16 lock entries, measured, taking the lockfile from
# 288 to 304 and the normal dependency graph of this crate from 119 to 134
# (`cargo tree -p libviprs -e normal`). Compare +21 for `jxl` and +29 for
# `svg`. Fifteen are `rav1d` and its runtime tree (`atomig`, `parking_lot`,
# `strum`, `zerocopy` and their tails); the sixteenth is `nasm-rs`, a
# build-dependency that never runs, see the note over `rav1d` above.
#
# Every one is pure Rust and none is a `-sys` crate, so enabling it does not
# put a C toolchain or a system library in the build. It does put `rav1d` in
# the `vendored_native` set of `tests/dependency_policy.rs`, because that
# check is static (ships native source AND has a build script able to compile
# it) and `rav1d` ships the dav1d assembly whether or not `asm` is on.
# CONTRIBUTING.md clause 3 allows exactly that and lists it by name.
avif = ["dep:rav1d"]
svg = ["dep:resvg"]
# Gates the JPEG XL loader and encoder in [`crate::jxl`]: the real bodies of
# `decode_jxl`, `Raster::encode_jxl` and `Raster::save_jxl`, the `.jxl` row in
# `Raster::save`'s extension route, and the `"jxl"` row in
# `Raster::encode_to_buffer`'s format route. With the feature off every one of
# them still exists, still compiles and keeps its signature; each returns a
# typed refusal the way `crate::svg` does without `svg`, so nothing about the
# public API moves and a consumer compiles against either build.
#
# Non-default for the same reason as `svg` above, and the numbers are the same
# order: +21 lock entries, measured, taking the normal dependency graph of this
# crate from 115 to 136 (`cargo tree -p libviprs -e normal`). Thirteen of them
# are the `jxl-*` family, three are `brotli-decompressor` and its two
# `alloc-*` crates, one is `zune-jpegxl`, and four are `tracing` and its tail;
# `zune-core` is free, because `image` and `zune-jpeg` already pull it either
# way. A release binary reaching the whole codec surface goes from 2,381,616
# to 4,781,648 bytes, +100.8%. Every one of the 21 is pure Rust with no
# `build.rs` C compile and no `-sys` crate, so enabling it does not put a C
# toolchain in the build, but nobody who does not read or write JPEG XL should
# pay for the compile.
#
# There is a second reason `svg` did not have, and it is the sharper one.
# `jxl-oxide` and `jxl-bitstream` both depend on `tracing` unconditionally, so
# an unconditional `jxl-oxide` puts `tracing` in the DEFAULT graph of a crate
# whose own `tracing = ["dep:tracing"]` feature is deliberately opt-in and
# whose `default` is empty. A consumer who never enables `tracing`, and even
# one who writes `default-features = false`, would compile and link it anyway,
# which makes that feature declaration a false statement rather than a choice.
# Behind `jxl` the opt-in holds again: `cargo tree -e normal -i tracing` prints
# "nothing to print" in the default build and finds it only when this feature
# is on.
#
# The MSRV hazard written up over `jxl-oxide` below is carried by the `msrv`
# job in `.github/workflows/ci.yml`, which is why that job names this feature
# explicitly. Without `--features jxl` the family is not in the graph at all
# and `cargo +1.97 check` would say nothing about it.
jxl = ["dep:jxl-oxide", "dep:jxl-grid", "dep:zune-jpegxl", "dep:zune-core"]
packfile = ["dep:tar", "dep:zip"]
# Gates public `Serialize` / `Deserialize` derives on the wire/config types
# (`PyramidPlan`, `LevelPlan`, `TileCoord`, `TileRect`, `Layout`,
# `EngineConfig`, `BlankTileStrategy`, `FailurePolicy`, `RetryPolicy`,
# `DedupeStrategy`, `WorkerId`) so out-of-process callers can reconstruct a
# job from a JSON envelope (issue #67). The serde crate itself is already a
# required dependency (resume checkpoints and packfile manifests use it
# internally), so this feature adds no dependencies; it only widens the
# public API surface, keeping the default build's API unchanged.
serde = []
# Exposes the crate's test-only sink doubles (currently `SlowSink`, a sink that
# sleeps in `write_tile` to exercise engine backpressure/timing) to *dependent*
# crates — chiefly the external `libviprs-tests` stress suite. These doubles are
# compiled for the crate's own unit tests unconditionally (via `cfg(test)`), but
# a dependent crate never sees `cfg(test)`, so this feature is what makes them
# reachable there. They are intentionally kept out of the default public API:
# production callers have no use for a sink that deliberately sleeps, and
# shipping it unconditionally invites accidental use. Adds no dependencies.
test-util = []
# Gates the JPEG 2000 loader and encoder in [`crate::jp2k`]: the real bodies
# of `decode_jp2k`, `Raster::encode_jp2k` and `Raster::save_jp2k`. With the
# feature off every one of them still exists, still compiles and keeps its
# signature; each returns a typed refusal the way `crate::jxl` does without
# `jxl`, so nothing about the public API moves.
#
# Non-default for the same reason as `svg` and `jxl` above, and **not** for
# the same price. Measured with `cargo generate-lockfile` on a clean tree,
# 288 packages before and 290 after: **+2 lock entries, and both of them are
# the two crates themselves**, because neither has a single dependency of
# its own. `svg` costs +29 and `jxl` costs +21. Nothing here reaches
# `tracing`, so the second argument that put `jxl` behind a flag (an
# unconditional `tracing` in the default graph of a crate whose own
# `tracing` feature is opt-in) does not apply at all: `cargo tree -e normal
# -i tracing --features jp2k` still prints "nothing to print".
#
# What is left is the compile, which is the argument `svg` made on its own:
# 9.7k lines of decoder and 36.9k lines of translated encoder is real build
# time, and nobody who does not read or write JPEG 2000 should pay it.
#
# Neither crate compiles C, declares a `links` key, runs a build script or
# carries a `-sys` suffix. `hayro-jpeg2000` is `#![forbid(unsafe_code)]` at
# the settings this build uses; the encoder's `unsafe` is a faithful
# translation of the OpenJPEG C and stays inside the dependency. See the two
# `[workspace.dependencies]` comments above for why these two crates and not
# the six other JPEG 2000 crates on crates.io.
jp2k = ["dep:hayro-jpeg2000", "dep:openjpeg2-pure"]

