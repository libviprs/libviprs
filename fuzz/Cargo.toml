[package]
name = "libviprs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]

[package.metadata]
cargo-fuzz = true

# Versions are single-sourced in [workspace.dependencies] at the repo root
# (issue #151). This crate is a workspace member, so it shares the root
# lockfile and the root dependency pins (including the pdfium-render fork).
[dependencies]
libfuzzer-sys = { workspace = true }
arbitrary = { workspace = true }
libviprs = { workspace = true, features = ["pvec-raster"] }
lopdf = { workspace = true }
flate2 = { workspace = true }

[features]
# `cargo fuzz run fuzz_pvec_pdf_image --features jp2k` makes the `JPXDecode` arm a codec that
# tries the stream (#1364) instead of the typed `FilterNotEnabled`.
jp2k = ["libviprs/jp2k"]

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
doc = false

[[bin]]
name = "fuzz_pdf_render"
path = "fuzz_targets/fuzz_pdf_render.rs"
doc = false

[[bin]]
name = "fuzz_radiance"
path = "fuzz_targets/fuzz_radiance.rs"
doc = false

[[bin]]
name = "fuzz_jxl"
path = "fuzz_targets/fuzz_jxl.rs"
doc = false

[[bin]]
name = "fuzz_exr"
path = "fuzz_targets/fuzz_exr.rs"
doc = false

[[bin]]
name = "fuzz_fits"
path = "fuzz_targets/fuzz_fits.rs"
doc = false

[[bin]]
name = "fuzz_jp2k"
path = "fuzz_targets/fuzz_jp2k.rs"
doc = false

[[bin]]
name = "fuzz_pmtiles_reader"
path = "fuzz_targets/fuzz_pmtiles_reader.rs"
doc = false

[[bin]]
name = "fuzz_vector_tiler"
path = "fuzz_targets/fuzz_vector_tiler.rs"
doc = false

[[bin]]
name = "fuzz_pvec_pdf_vector"
path = "fuzz_targets/fuzz_pvec_pdf_vector.rs"
doc = false

[[bin]]
name = "fuzz_pvec_pdf_image"
path = "fuzz_targets/fuzz_pvec_pdf_image.rs"
doc = false
