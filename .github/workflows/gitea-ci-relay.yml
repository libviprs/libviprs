name: gitea-ci-relay

# Pushes land on GitHub first and reach our Gitea Actions runner through a pull
# mirror. This workflow nudges that mirror so `.gitea/workflows/*` runs against the
# commit that was just pushed, then checks that the rest of the chain actually
# happened.
#
# The chain has three links, and the old single-step job checked none of them.
# `POST /mirror-sync` only queues the sync and answers 200 with an empty body
# (routers/api/v1/repo/mirror.go), so a passing `curl -sf` proves the repo exists,
# is a mirror, and the token can write, and stops there. That is why this workflow
# was green for the month described in #530 while no `gitea/*` status ever arrived.
#
#   1. the mirror reaches the pushed commit            -> verify-sync, step 1
#   2. Gitea can and does run CI for it                -> verify-sync, steps 2 and 3
#   3. the result comes back as a `gitea/*` status     -> await-gitea-status
#
# Link 3 is the one that is broken today, so it gets its own job. Waiting for it
# costs wall-clock rather than money (libviprs is public), but it is still a long
# wait, so it runs on `main` and on manual dispatch rather than on every branch.

on:
  push:
  workflow_dispatch:

# A newer push supersedes the wait; only the tip of a branch is worth watching.
concurrency:
  group: gitea-relay-${{ github.ref }}
  cancel-in-progress: true

env:
  GITEA_API: https://git.opsite.ca/api/v1

jobs:
  nudge-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Gitea mirror sync
        env:
          GITEA_SYNC_TOKEN: ${{ secrets.GITEA_SYNC_TOKEN }}
        run: |
          curl -sf -X POST -H "Authorization: token $GITEA_SYNC_TOKEN" \
            "$GITEA_API/repos/${{ github.repository }}/mirror-sync"

  verify-sync:
    needs: nudge-mirror
    # Branch deletions carry no commit to wait for, and tag pushes have no branch
    # head to compare against.
    if: startsWith(github.ref, 'refs/heads/') && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITEA_SYNC_TOKEN: ${{ secrets.GITEA_SYNC_TOKEN }}
    steps:
      - name: Wait for the mirror to reach this commit
        run: |
          set -euo pipefail
          # `/branches/*` is a wildcard route, so branch names containing `/` are fine.
          url="$GITEA_API/repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME"
          for attempt in $(seq 1 36); do
            got="$(curl -sf -H "Authorization: token $GITEA_SYNC_TOKEN" "$url" \
              | jq -r '.commit.id // empty')" || got=""
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "Mirror reached $GITHUB_SHA on '$GITHUB_REF_NAME' after ~$((attempt * 5))s."
              exit 0
            fi
            echo "attempt $attempt/36: mirror is at '${got:-<unreadable>}', waiting for $GITHUB_SHA"
            sleep 5
          done
          echo "::error title=Gitea mirror never synced::The pull mirror did not reach $GITHUB_SHA on '$GITHUB_REF_NAME' within 3 minutes. The mirror-sync POST was accepted, so the sync was queued and then did not complete. Check the pull-mirror settings and sync log on Gitea (issue #530)."
          exit 1

      # One call, no polling. This is the deterministic half of "can Gitea run CI
      # here at all": the route sits behind `reqRepoReader(unit.TypeActions)`, so a
      # 403/404 means the Actions unit is off for the mirror, which is the silent gate
      # in Gitea's notify() that makes it return before detecting any workflow. An
      # empty or disabled list is the other way this goes quiet.
      - name: Check Gitea can run workflows for this repo
        run: |
          set -euo pipefail
          response="$(curl -s -w '\n%{http_code}' -H "Authorization: token $GITEA_SYNC_TOKEN" \
            "$GITEA_API/repos/$GITHUB_REPOSITORY/actions/workflows")"
          code="$(printf '%s' "$response" | tail -n1)"
          body="$(printf '%s' "$response" | sed '$d')"
          [ -n "$body" ] || body='{}'

          if [ "$code" = "404" ] || [ "$code" = "403" ]; then
            echo "::error title=Gitea Actions unavailable on the mirror::GET /actions/workflows returned HTTP $code. That route requires read access to the repository's Actions unit, so the unit is almost certainly disabled on the mirrored repo (Settings -> Units -> Actions), which makes Gitea drop every workflow trigger silently. See issue #530."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::warning::GET /actions/workflows returned HTTP $code; cannot confirm Gitea sees any workflow."
            exit 0
          fi

          printf '%s' "$body" | jq -r '.workflows[]? | "  \(.path)  state=\(.state)"'
          total="$(printf '%s' "$body" | jq -r '.total_count')"
          if [ "$total" -eq 0 ]; then
            echo "::error title=Gitea parsed no workflows::Gitea lists zero workflows for this repo, so nothing in .gitea/workflows is being read. See issue #530."
            exit 1
          fi
          inactive="$(printf '%s' "$body" | jq -r '[.workflows[]? | select(.state != "active") | .path] | join(", ")')"
          if [ -n "$inactive" ]; then
            echo "::error title=Gitea workflow disabled::These workflows are not active on Gitea and will never run: $inactive"
            exit 1
          fi
          echo "Gitea has $total active workflow(s) for this repo."

      # Deliberately advisory. `/actions/tasks` lists tasks a runner has already claimed
      # (models/actions/task.go, CreateTaskForRunner), never queued ones, so a miss here
      # measures how backed up the runner is rather than whether anything is wrong. It
      # produced a false negative on my own first push. The end-to-end gate that does
      # hard-fail is await-gitea-status.
      - name: Note whether a runner has claimed a task yet
        run: |
          set -euo pipefail
          url="$GITEA_API/repos/$GITHUB_REPOSITORY/actions/tasks?limit=50"
          for _ in $(seq 1 36); do
            body="$(curl -sf -H "Authorization: token $GITEA_SYNC_TOKEN" "$url")" || body='{}'
            matches="$(printf '%s' "$body" \
              | jq --arg sha "$GITHUB_SHA" '[.workflow_runs[]? | select(.head_sha == $sha)] | length')"
            if [ "$matches" -gt 0 ]; then
              echo "Gitea is running $matches task(s) for $GITHUB_SHA."
              exit 0
            fi
            sleep 5
          done
          echo "::warning title=Runner has not started this commit yet::No Gitea Actions task has claimed $GITHUB_SHA after 3 minutes. That usually just means the runner is busy with an earlier build. Newest tasks Gitea holds:"
          curl -sf -H "Authorization: token $GITEA_SYNC_TOKEN" "$GITEA_API/repos/$GITHUB_REPOSITORY/actions/tasks?limit=10" \
            | jq -r '.workflow_runs[]? | "  \(.head_branch)  \(.head_sha[0:12])  \(.workflow_id)  \(.status)"' || true

  # The whole point of the Gitea round trip is a `gitea/*` commit status on GitHub.
  # Nothing else in this workflow can tell whether that last hop works, because it
  # happens inside the Gitea `report` job and fails silently there. Watch for it
  # directly. On `main` only: a merge is worth one long wait, a branch push is not.
  await-gitea-status:
    needs: verify-sync
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      statuses: read
    steps:
      - name: Wait for a gitea/* status to arrive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            contexts="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" \
              --jq '[.statuses[] | select(.context | startswith("gitea/")) | "\(.context)=\(.state)"] | join(" ")')"
            if [ -n "$contexts" ]; then
              echo "Gitea reported back: $contexts"
              exit 0
            fi
            echo "attempt $attempt/80: no gitea/* status on $GITHUB_SHA yet"
            sleep 30
          done
          echo "::error title=Gitea never reported back::Gitea ran CI for $GITHUB_SHA but posted no gitea/* commit status within 40 minutes. The runs happen; the last hop does not. The reporting steps authenticate with secrets.GH_STATUS_TOKEN, so that secret is almost certainly unset, expired, or missing the repo:status scope on Gitea. See issue #530."
          exit 1
