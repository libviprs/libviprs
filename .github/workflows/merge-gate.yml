name: Merge Gate

# The deep checks. Loom and the pdfium-render source audit run on every branch
# push and on pull requests into `main` or `release`. Miri is held at the
# release boundary by the `if:` on its job, because it still does not pass
# (#675). The shape of the failure has changed twice and the colour has not.
# It used to burn 90 minutes and report `cancelled`; #675 made it abort in a
# couple of minutes naming the next test that needed an annotation; and now
# that #712 and #739 have annotated them it is back to burning the clock, this
# time in the `--lib` target on the first test it runs.
#
# The split is measured rather than assumed. The old trigger sat all three
# behind `branches: [release]` on the grounds that they are too slow for
# day-to-day branch work, and for Miri that is true and then some. For the
# other two it is not close. Across the four dispatched runs on 2026-08-26 and
# 08-27:
#
#   pdfium-render source audit    11s, 11s, 19s, 20s    all green
#   Loom                          33s, 39s, 39s, 39s    all green
#   Miri                          never finished
#
# So two of the three cost about a minute between them, and had been sitting
# behind a trigger that last fired on 2026-04-25, four months earlier. That is
# the whole of #642. The checks were not too slow, they were unreachable.
#
# "Gate" in the name is historical, and today it is aspirational: these jobs
# run and report, they do not block. Nothing in this repository enforces them.
# `main` carries branch protection with no `required_status_checks` at all (the
# sub-resource 404s), `release` is not protected, and the only ruleset, `basic`,
# sits at `enforcement: "disabled"`. So a red Loom does not stop a merge, and
# nothing here changes that.
#
# If you are the person turning required checks on, read the note on the `miri`
# job before you do. There is a trap in it that costs you the coverage you
# think you are buying.
#
# Ported back from `.gitea/workflows/merge-gate.yml` as part of dropping Gitea
# (#585). The Gitea copy bookended the `miri` job with "Report pending to
# GitHub" and carried a trailing `report` job, both of which existed only to
# push a `gitea/merge-gate` commit status here through `GH_STATUS_TOKEN`.
# Running natively on GitHub they report nothing the run itself does not, so
# they are gone.

on:
  # Branch pushes are what actually carries this workflow, exactly as in
  # ci.yml. The long note at the top of `.github/workflows/ci.yml` has the
  # dated measurements and the method for re-checking them; the short version
  # is that GitHub never creates a `pull_request` run while the pull request
  # has a merge conflict, and that in this epic a branch conflicts with `main`
  # on CHANGELOG.md the moment any other lane merges, so conflicting is the
  # normal state here rather than the exception.
  #
  # I had this right for `release` and missed it for `main`. Gating the fast
  # pair on `pull_request` alone would have reproduced #642 inside the fix for
  # #642: a check that silently reports nothing on precisely the mid-epic pull
  # requests where the new decoder dependencies' `unsafe` most needs covering.
  # A `push` run builds the branch head, needs no merge commit, and so is
  # unaffected by whether the pull request currently merges.
  push:
    branches: ['**']

  # `synchronize` is deliberately absent, for the reason ci.yml spells out: a
  # push to a branch in this repository is already covered above, and adding
  # `synchronize` would run everything twice for every one of those pushes.
  # What is left here are the pull-request transitions that no push accompanies.
  #
  # This is also the only trigger that covers a pull request opened from a
  # fork, where no push ever reaches this repository. The repository has no
  # forks today; if that changes, add `synchronize` back and guard the jobs so
  # in-repo branches do not run twice.
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main, release]

  # Manual dispatch stays, and it is now the only way to ask for Miri outside a
  # release pull request. `run_miri` defaults false so the fast pair can be
  # dispatched on its own, which is the operation #642 most wants available:
  # the old `if:` keyed off `github.event_name == 'workflow_dispatch'`, so every
  # manual run queued a 90 minute Miri alongside the minute of useful work.
  workflow_dispatch:
    inputs:
      run_miri:
        description: 'Also run Miri (does not finish inside the 90m ceiling, #675)'
        type: boolean
        default: false

# One group per branch, shared by the push run and any pull_request run for the
# same branch, so a newer push supersedes an older run rather than racing it.
# `main` is excluded: that run is the record of what actually landed. Same
# shape as ci.yml, keyed on `github.workflow` as well as the branch so the two
# workflows never cancel each other.
concurrency:
  group: merge-gate-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Miri is kept, deliberately.
  #
  # It runs on the dev machine again, on a *dated* nightly. This block used to
  # say `cargo +nightly miri test` could not run there, and gave the reason: the
  # nightly installed at the time was 1.96.0-nightly (1d8897a4e, 2026-03-13),
  # older than the crate's MSRV of 1.97, so cargo refused to build before Miri
  # was reached. That is still true of the floating `nightly` on that machine
  # today, so `make miri` pins `MIRI_TOOLCHAIN` to a nightly that satisfies the
  # MSRV and checks it before running. Read the `Makefile` for the whole of it.
  #
  # That leaves one thing the mirror cannot mirror, and it is worth being blunt
  # about it: this job resolves `dtolnay/rust-toolchain@nightly` on the day and
  # the local side pins a date, so the two run the same command and the same
  # flags on *different compilers*. `tests/miri_invocation_parity.rs` compares
  # the command and the environment, not the compiler, because there is nothing
  # it could compare them to. A local green is evidence about the crate, not a
  # prediction of this job.
  #
  # It is real coverage rather than decoration, which is the bar for keeping a
  # check at all, but be precise about whose code it covers. The default Miri
  # invocation reaches none of this crate's own `unsafe`, and the one place it
  # lives is a single feature flag away: `src/avif.rs` carries ten real blocks,
  # a dav1d FFI boundary with an `unsafe extern "C"`, a raw pointer `as_ref()`
  # and pointer arithmetic with an unaligned read. All of it is behind
  # `#[cfg(feature = "avif")]`, and `default = []`, so a bare `cargo miri test`
  # compiles every one of them out. Running Miri with `--features avif` would
  # not, and that is the interesting case rather than a hazard to avoid.
  #
  # So by default Miri here checks the `unsafe` in the dependencies the tests
  # reach, which is a dozen image decoders plus the colour and hash crates, and
  # that is the surface #642 was filed about in the first place.
  #
  # This paragraph used to say the crate had no `unsafe` at all, "all four
  # matches for the word under `src/` are in comments". It was wrong, nothing
  # checked it, and it sent issue #675 looking in the wrong place.
  # `tests/unsafe_inventory.rs` now holds it to the tree (issue #897).
  #
  # The tree is maintained for it: every filesystem-touching test is meant to
  # carry a `#[cfg_attr(miri, ignore)]` naming the isolation limit it works
  # around, the set is pinned by `tests/miri_fs_test_inventory.txt`, and
  # `tests/miri_ignore_convention.rs` holds that file against the tree (#652,
  # #670). Counts live in the inventory rather than here, on purpose: this file
  # quoted "48 annotations across seven modules" for months after it stopped
  # being true, and quoting the live number instead made this a file every
  # unrelated pull request had to edit. Dropping this job would quietly remove
  # the only check the repository has on undefined behaviour.
  miri:
    name: Miri
    runs-on: ubuntu-latest
    # Held at the release boundary rather than widened with the other two,
    # because it still does not pass. Three consecutive dispatched runs were
    # killed at the 90 minute ceiling below, and the run before that ceiling
    # existed went 4h13m. Since #675 it aborts fast instead, on the first
    # unannotated filesystem test, so the cost of widening it would now be
    # minutes rather than hours. It stays held anyway, because a check that is
    # red by construction on every pull request teaches people to ignore it.
    #
    # Do not read that as "#712 turns this green". #712 clears the aborts; it
    # says nothing about the clock, and the clock looks bad. Measured on
    # nightly-2026-08-20 with isolation on and the sha2 backend pinned, the
    # single proptest `arithmetic::proptests::no_try_method_panics_on_a_float_raster`
    # ran for over twenty minutes under the interpreter without finishing. It
    # touches no filesystem, so it carries no annotation and #712 will never
    # reach it, and it is one test out of more than fifteen hundred in the lib
    # target alone.
    #
    # So the open question is not "when does #712 land" but whether Miri on this
    # crate wants a whole-suite invocation at all, or a `--lib`-only or
    # per-target one aimed at the code whose `unsafe` is worth interpreting.
    # That is #652's territory and it wants deciding before anyone promises a
    # green Miri job.
    #
    # `inputs.run_miri` is null on every event except `workflow_dispatch`, so
    # this reads as: a release pull request, or someone asking for it by hand.
    # A push run carries no `base_ref`, so pushes never queue Miri either.
    #
    # #675 has landed and this condition is still here, on purpose. Read what
    # follows before you drop it, and before anyone makes these checks required
    # on `main`.
    # GitHub reports a job skipped by a job-level `if:` to branch protection as
    # **passing**, not as skipped. So with required checks turned on and this
    # condition still in place, "Miri" goes green on every `main` pull request
    # without ever having run, which is a worse outcome than today's honest
    # `skipping` on the run page: it manufactures the exact false assurance
    # #642 was filed about. Either the condition comes off or Miri stays off
    # the required list. Not both.
    if: inputs.run_miri || github.base_ref == 'release'
    # A hang has to report as a failure, not as a cancellation. Miri on this
    # crate has run past 1h27m, been cancelled at 1h41m, and gone 4h without
    # finishing, and with no ceiling the only signal was "cancelled", which
    # reads like someone pressed stop rather than like the check breaking.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # There is no `-Zmiri-disable-isolation` here any more, and it must not
      # come back. `tests/miri_invocation_parity.rs` fails if it does.
      #
      # It was added to let the filesystem tests run at all, with the claim that
      # this was not a coverage loss: the annotated tests stay ignored and only
      # *unannotated* fs tests stop aborting the run, so the job covers strictly
      # more. That was reasoning, not measurement, and it was false. Letting
      # those tests execute under the interpreter is what pushed the run past
      # any ceiling, so the job covered strictly less. It covered nothing,
      # because it never reported: three consecutive runs died at the 90 minute
      # ceiling and reported `cancelled`. #675.
      #
      # With the flag gone the run aborted on the first unannotated filesystem
      # test instead. #712 and #739 fixed that: 134 tests across 28 files took
      # the annotation, #781 found 72 more that reach the filesystem through a
      # test helper, and #756 took the last four.
      #
      # That was where this comment stopped, and it was one measurement short.
      # Six more reached the filesystem through a library entry point that opens
      # the `Path` it is handed, which the scanner reads as pure on purpose, so
      # they were in neither the inventory nor the annotated set and any one of
      # them would still have ended the run. #765 found them by running every
      # test binary under a syscall interposer rather than by reading, and
      # annotated them. So
      # every filesystem-touching test carries the annotation
      # now: `tests/miri_ignore_convention.rs` refuses one that does not, its
      # exception list is empty, and `tests/miri_fs_test_inventory.txt` records
      # the set. The count lives there rather than here so that adding one
      # filesystem test does not mean editing this workflow;
      # `tests/miri_invocation_parity.rs` holds the claim.
      #
      # That moved the wall rather than removing it. What stops this job
      # reporting now is the clock, which is the half of #675 nobody had
      # measured, because nobody had run the unfiltered command far enough to
      # see it. `cargo miri test` runs the `--lib` target first and libtest
      # runs it in sorted order, so the first two tests of the whole invocation
      # are the two `arithmetic::proptests`. Measured at bd4bb1d on
      # nightly-2026-08-20 with isolation on, ten cores at load average 15:
      # ten minutes to build, six more for the first test, and the second was
      # still running when a 35 minute bound cut the run off. One of 1596 lib
      # tests done, and no unannotated filesystem test had been reached at all.
      # Neither of those two touches the filesystem, so no annotation reaches
      # them.
      #
      # So #652's question is the live one: whether Miri on this crate wants a
      # whole-suite invocation at all, or a per-target one aimed at the code
      # whose `unsafe` is worth interpreting.
      #
      # `RUSTFLAGS` carries two things, and the `Makefile` mirror carries the
      # same string.
      #
      # `-A deprecated` is the nightly-only half of #643. Nightly std has
      # renamed `AtomicU64::fetch_update` to `try_update` and deprecated the old
      # name, and the crate sets `[lints.rust] deprecated = "deny"`, so the lib
      # does not compile under nightly at all and Miri never runs. It lives here
      # rather than as an `#[allow(deprecated)]` in `src/observe.rs` because the
      # attribute has no `cfg` to hang the "nightly only" claim on: it would
      # disarm the deny on stable too, at the exact call site the deny was added
      # to watch, for every expression inside that statement. This is scoped to
      # the one job that needs it.
      #
      # Cargo appends `RUSTFLAGS` after the `[lints]` table's own `--deny=...`,
      # and rustc takes the last lint-level flag on the command line, so this
      # does win. Verified with `cargo build -v`.
      #
      # `--cfg sha2_backend="soft"` pins sha2's portable backend (#707), and it
      # matters locally rather than here. Be exact about that, because the first
      # version of this comment was not.
      #
      # Under Miri, `cpufeatures` does not detect anything at runtime. It
      # compiles to `cpufeatures-0.3.1/src/miri.rs`, where the detection macro is
      # replaced by `cfg!(all(target_feature = ...))` and the probe by a constant
      # `false`. So sha2's backend is chosen at *compile* time, from the
      # target's baseline features. `rustc --print cfg` settles what those are:
      # `aarch64-apple-darwin` carries `target_feature="sha2"`, and
      # `x86_64-unknown-linux-gnu` carries `sse2` but none of `sha`, `ssse3` or
      # `sse4.1`, which is what sha2's x86 path needs.
      #
      # That gives two different facts, not one. On the dev machine the NEON
      # backend is selected and the run reaches `vld1q_u32(&K32[0])`, a 16 byte
      # load through a `&u32` whose retag covers four, and aborts about 30
      # seconds in on a Stacked Borrows violation. On this runner the portable
      # backend was already being selected, so the flag changes nothing at all
      # here and costs no coverage: the SIMD path it gives up was never compiled
      # in the first place. It is set on both sides so the two invocations stay
      # one string, and so that a runner image moving to arm64 would not quietly
      # reintroduce the abort.
      #
      # The violation itself is on file against Miri as rust-lang/miri#3900,
      # "SIMD load intrinsics false positive", closed as not planned, so it is
      # Stacked Borrows being stricter than the model that eventually lands
      # rather than something that can go wrong at runtime.
      #
      # `-Zmiri-tree-borrows` clears it too, measured. It is not used because it
      # is the larger change of the two: it swaps the aliasing model for the
      # whole run, and Tree Borrows accepts this pattern by design rather than by
      # accident, so it would also be a defensible answer. What it is not is a
      # *safer* one, and the argument that it "changes the model every test is
      # checked against" is worth discounting while no test is being checked at
      # all. If the backend pin ever becomes awkward, switching is a one line
      # change here and in the `Makefile`.
      - run: cargo +nightly miri test
        env:
          RUSTFLAGS: '-A deprecated --cfg sha2_backend="soft"'

  loom:
    name: Loom
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTFLAGS="--cfg loom" cargo test --lib loom_tests
      # `--lib loom_tests` is a test-path filter, so it only ever matched the
      # `loom_tests` module. `src/loom_checkpoint_dedupe.rs` is a second
      # `#![cfg(loom)]` suite (the models behind #275, including the ones whose
      # buggy variants reproduce the pre-fix interleaving) and none of its test
      # paths contain "loom_tests", so it has never run in CI on either forge.
      # Run it explicitly rather than widening the filter, so adding a third loom
      # module is a visible edit here instead of a silent no-op.
      - run: RUSTFLAGS="--cfg loom" cargo test --lib loom_checkpoint_dedupe

  pdfium-source:
    name: pdfium-render source audit (#149)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fail the run if the pdfium-render thread-safety fork is not resolved
      # from the libviprs git source (i.e. the [patch.crates-io] was dropped and
      # the unpatched, segfault-prone wrapper would be linked).
      - run: bash scripts/audit-pdfium-source.sh . -- --features pdfium
