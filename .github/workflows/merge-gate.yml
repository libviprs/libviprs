name: Merge Gate

# The deep checks. Miri is the release gate, too slow to justify on every branch
# push; Loom and the pdfium audit gate `main`, because they are not slow at all
# and gating them at `release` only made them unreachable (#642). Ported back
# from
# `.gitea/workflows/merge-gate.yml` as part of dropping Gitea (#585).
#
# The Gitea copy bookended the `miri` job with "Report pending to GitHub" and
# carried a trailing `report` job, both of which existed only to push a
# `gitea/merge-gate` commit status here through `GH_STATUS_TOKEN`. Running
# natively on GitHub they report nothing that the run itself does not, so they
# are gone. The three real jobs are unchanged apart from the loom fix noted
# below.

on:
  # Loom and the pdfium audit gate every pull request into `main`. Miri stays at
  # the release boundary, held there by the `if:` on that job below.
  #
  # The split is measured rather than assumed. The old trigger gated all three
  # at `release` on the grounds that they are too slow for day-to-day branch
  # work, and for Miri that is true and then some. For the other two it is not
  # close. Across the four dispatched runs on 2026-08-26 and 08-27:
  #
  #   pdfium-render source audit    11s, 11s, 19s, 20s    all green
  #   Loom                          33s, 39s, 39s, 39s    all green
  #   Miri                          never finished
  #
  # So two of the three cost about a minute between them, and had been sitting
  # behind a gate that last fired on 2026-04-25, four months earlier. That is
  # the whole of #642. The checks were not too slow, they were unreachable.
  #
  # `workflow_dispatch` stays. A `pull_request` run is never
  # created while the pull request has a merge conflict (the long note in ci.yml
  # has the measurements), and a release PR is exactly the kind that sits
  # conflicted for a while. Without a manual trigger the gate would be
  # unreachable at precisely the moment it matters.
  pull_request:
    branches: [main, release]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Miri is kept, deliberately.
  #
  # `cargo +nightly miri test` cannot run on the dev machine at the moment, which
  # sounds like a reason to drop the job, but the cause is local and says nothing
  # about this workflow. The nightly installed there is 1.96.0-nightly
  # (1d8897a4e, 2026-03-13), which is *older* than the crate's MSRV of 1.97, so
  # the crate does not compile under it at all. `dtolnay/rust-toolchain@nightly`
  # on a GitHub-hosted runner resolves the current nightly, which is well past
  # 1.97, so the job builds where it actually runs. `rustup update nightly` is the
  # local fix.
  #
  # It is also real coverage rather than decoration, which is the bar for keeping
  # a gate at all. The tree is actively maintained for Miri: 48
  # `#[cfg_attr(miri, ignore)]` annotations across seven modules, each naming the
  # isolation limit it works around, and a `fix/miri-fs-isolation` branch that
  # went green through this gate. The last GitHub runs of this workflow, on
  # 2026-04-25, all passed. Dropping it would quietly remove the only check the
  # repository has on undefined behaviour.
  miri:
    name: Miri
    runs-on: ubuntu-latest
    # Held at the release boundary rather than widened to `main` with the other
    # two, because it does not currently finish at all (#675). Three consecutive
    # dispatched runs were killed at the 90 minute ceiling below, and the run
    # before that ceiling existed went 4h13m. Widening this now would put a 90
    # minute timeout on every pull request and report it as `cancelled`. When
    # #675 lands, which is itself waiting on #670, drop this condition so Miri
    # gates `main` too.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'release'
    # A hang has to report as a failure, not as a cancellation. Miri on this
    # crate has run past 1h27m, been cancelled at 1h41m, and gone 4h without
    # finishing, and with no ceiling the only signal was "cancelled", which
    # reads like someone pressed stop rather than like the gate breaking.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # `-Zmiri-disable-isolation` is what lets the fs-touching tests run at all.
      # Without it Miri refuses `mkdir` and the whole run aborts on the first
      # test that reaches for a `tempdir`, which is how this gate broke: nothing
      # enforces the `#[cfg_attr(miri, ignore)]` convention below, so one new
      # test using `tempfile` takes the job down and reports it as a Miri
      # failure rather than as a missing annotation.
      #
      # I claimed here that this was not a coverage loss, on the reasoning that
      # the 48 annotated tests stay ignored and only *unannotated* fs tests stop
      # aborting the run, so the job covers strictly more. I never measured it
      # and it is false. Letting those unannotated tests actually execute under
      # Miri is what pushed the run past any ceiling, so the job now covers
      # strictly less: it covers nothing, because it never reports. The old
      # behaviour at least aborted quickly and named the unannotated test.
      #
      # The flag stays for the moment only because removing it before #670 lands
      # puts the gate straight back to aborting on the first `tempdir`. #675 has
      # the ordering and the measurements; #652 has the larger question of
      # un-ignoring those 48 tests.
      #
      # `RUSTFLAGS: -A deprecated` is the nightly-only half of #643. Nightly std
      # has renamed `AtomicU64::fetch_update` to `try_update` and deprecated the
      # old name, and the crate sets `[lints.rust] deprecated = "deny"`, so the
      # lib does not compile under nightly at all and Miri never runs. It lives
      # here rather than as an `#[allow(deprecated)]` in `src/observe.rs`
      # because the attribute has no `cfg` to hang the "nightly only" claim on:
      # it would disarm the deny on stable too, at the exact call site the deny
      # was added to watch, for every expression inside that statement. This is
      # scoped to the one job that needs it.
      #
      # Cargo appends `RUSTFLAGS` after the `[lints]` table's own `--deny=...`,
      # and rustc takes the last lint-level flag on the command line, so this
      # does win. Verified with `cargo build -v`.
      - run: cargo +nightly miri test
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          RUSTFLAGS: -A deprecated

  loom:
    name: Loom
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTFLAGS="--cfg loom" cargo test --lib loom_tests
      # `--lib loom_tests` is a test-path filter, so it only ever matched the
      # `loom_tests` module. `src/loom_checkpoint_dedupe.rs` is a second
      # `#![cfg(loom)]` suite (the models behind #275, including the ones whose
      # buggy variants reproduce the pre-fix interleaving) and none of its test
      # paths contain "loom_tests", so it has never run in CI on either forge.
      # Run it explicitly rather than widening the filter, so adding a third loom
      # module is a visible edit here instead of a silent no-op.
      - run: RUSTFLAGS="--cfg loom" cargo test --lib loom_checkpoint_dedupe

  pdfium-source:
    name: pdfium-render source audit (#149)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fail the release gate if the pdfium-render thread-safety fork is not
      # resolved from the libviprs git source (i.e. the [patch.crates-io] was
      # dropped and the unpatched, segfault-prone wrapper would be linked).
      - run: bash scripts/audit-pdfium-source.sh . -- --features pdfium
