name: publish

# Publishes the `libviprs` crate to crates.io. Ported back to GitHub from
# `.gitea/workflows/publish.yml` as part of dropping Gitea (#585). The job body
# below is the pre-migration GitHub workflow restored as it was, including the
# `permissions: contents: read` line that the Gitea copy had dropped.
#
# !!! ONE DELIBERATE DIFFERENCE: THIS IS MANUAL-ONLY !!!
#
# The original fired automatically on the push that landed a release on the
# `release` branch. That trigger is commented out below rather than restored,
# because re-arming it would be a change in release behaviour smuggled in under a
# CI migration, and #585 says not to do that.
#
# The specific hazard: `CARGO_REGISTRY_TOKEN` is not a repository secret here, but
# this repository belongs to an org whose secrets I cannot read, so I cannot prove
# it is not inherited. Publishing has been dormant on GitHub since #528 moved CI
# away in July. If the token does resolve, restoring the push trigger would turn
# the next merge into `release` into a live upload to crates.io, silently, as a
# side effect of a CI change. Manual dispatch cannot do that by accident, and it
# keeps the `dry_run` toggle, which is how you would want to test this anyway.
#
# To re-arm it, uncomment the two `push` lines, having first confirmed that
# `CARGO_REGISTRY_TOKEN` resolves and that #981 is resolved.
#
# NOTE (issue #981): this job used to die at dependency resolution, because the
# manifest asked `pdfium-render` for a `sync` feature that upstream deleted in
# 0.9.0 and only our fork still carried as a synonym. `cargo publish` resolves
# against crates.io, where a git source does not survive, so it was the one
# resolver that ever saw the mismatch. Renaming it to `thread_safe` fixed that
# half.
#
# The other half was soundness, and it is now settled. Registry 0.9.0 through
# 0.9.3 dropped `src/bindings/thread_safe.rs`, so there `thread_safe` is a bare
# `unsafe impl Send + Sync for Pdfium` with no serialisation at all
# (ajrcarey/pdfium-render#262). Upstream reinstated the bindings in 0.9.4, which
# published on 2026-09-06, and `Cargo.toml` now declares that as the floor.
#
# Do not read "0.9.4 reinstated the per-call locking" as more than it is. That
# release locks 290 of its 484 binding methods, and
# `FPDF_RenderPageBitmapWithMatrix`, which every `.apply_matrix()` render goes
# through, is not one of them. libviprs is unaffected because it serialises
# with its own `pdfium_lock()` across whole operations and exposes no
# pdfium-render type in its public API, so the wrapper's `Send + Sync` is not
# reachable from this crate. That is the argument for publishing, and it is an
# argument about libviprs rather than about the dependency.
#
# The guard step below therefore checks the things that argument rests on
# rather than a version number: a registry source, a floor of 0.9.4, an
# explicitly named libpdfium ABI, and `thread_safe` requested. A floor compare
# on its own would have passed 0.9.4 while printing a justification that is not
# true.
#
# Still to confirm before re-arming the `push:` trigger below: that
# `CARGO_REGISTRY_TOKEN` resolves. The next publish is 0.3.1 to 0.5.0 as far as
# crates.io is concerned, because 0.4.0 was cut in CHANGELOG.md and never
# uploaded.

on:
  # push:
  #   branches: [release]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package + verify only (cargo publish --dry-run), do not upload"
        type: boolean
        default: false

permissions:
  contents: read

# Never run two publishes concurrently; never cancel an in-flight upload.
concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve the crate version
        id: v
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "libviprs") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "libviprs version: $version"

      - name: Skip if this version is already on crates.io
        id: check
        run: |
          version="${{ steps.v.outputs.version }}"
          if curl -sf -H 'User-Agent: libviprs-publish-ci' \
               "https://crates.io/api/v1/crates/libviprs/${version}" \
               | jq -e '.version.num' >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::libviprs ${version} is already published on crates.io — skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Loud refusal, not a silent skip. A dry run still packages and verifies;
      # only a real upload is blocked.
      #
      # This step used to compare the declared floor against 0.9.4 and stop
      # there. That was the right instinct and the wrong instrument. "0.9.4
      # carries the reinstated per-call locking bindings" is only about 60%
      # true: the file is back, but 290 of its 484 binding methods take the
      # lock and `FPDF_RenderPageBitmapWithMatrix` is not one of them. A version
      # compare would have waved that through while printing a justification
      # that is false, which is worse than no guard, because it looks like it
      # checked.
      #
      # So the floor is still asserted, because it is what keeps a consumer off
      # 0.9.0 to 0.9.3 where `thread_safe` gates a bare `unsafe impl Send +
      # Sync` with nothing behind it. But the two things that actually make this
      # crate safe to publish are asserted directly instead of assumed: the
      # dependency resolves from crates.io rather than a git fork that cannot
      # survive publish, and the libpdfium ABI is named rather than inherited
      # from the floating `pdfium_latest`. `tests/pdfium_dependency_contract.rs`
      # holds the same three claims, so this is the release-time copy of a check
      # that also runs on every PR.
      - name: Refuse a real upload unless the published contract is true
        if: steps.check.outputs.already == 'false' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          meta="$(cargo metadata --no-deps --format-version 1)"
          dep="$(printf '%s' "$meta" | jq -r '.packages[] | select(.name == "libviprs")
                   | .dependencies[] | select(.name == "pdfium-render")')"
          req="$(printf '%s' "$dep" | jq -r .req | head -1)"
          src="$(printf '%s' "$dep" | jq -r '.source // "registry"' | head -1)"
          feats="$(printf '%s' "$dep" | jq -r '.features | join(",")' | head -1)"
          uses_default="$(printf '%s' "$dep" | jq -r .uses_default_features | head -1)"
          echo "pdfium-render: req=$req source=$src features=$feats defaults=$uses_default"

          fail() { echo "::error::$1"; exit 1; }

          case "$src" in
            *git+*) fail "pdfium-render resolves from a git source ($src). Cargo strips that on publish, so this upload would hand crates.io consumers different code from the one CI tested. See #981." ;;
          esac

          floor="${req#^}"; floor="${floor#>=}"; floor="${floor%% *}"
          if [ "$(printf '%s\n0.9.4\n' "$floor" | sort -V | head -1)" != "0.9.4" ]; then
            fail "libviprs declares pdfium-render \"$req\" (floor $floor). 0.9.0 through 0.9.3 gate thread_safe on a bare unsafe impl Send + Sync with no serialisation (ajrcarey/pdfium-render#262), and none of them is yanked, so this floor lets a consumer resolve one."
          fi

          case "$feats" in
            *pdfium_7881*) ;;
            *) fail "no pdfium_XXXX feature is named (features: $feats). Inheriting pdfium_latest lets a wrapper patch release swap the whole bindgen ABI under a libpdfium this project pins separately, and a changed signature on a kept symbol is silent rather than a link error." ;;
          esac
          if [ "$uses_default" != "false" ]; then
            fail "pdfium-render takes default features, which turns pdfium_latest back on."
          fi
          case "$feats" in
            *thread_safe*) ;;
            *) fail "thread_safe is not requested, and static PDFIUM: OnceLock<Pdfium> does not compile without it." ;;
          esac

          echo "::notice::Published contract holds: registry source, floor $floor, ABI pinned, thread_safe requested."

      - name: Publish to crates.io
        if: steps.check.outputs.already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run — packaging + verifying only."
            cargo publish --dry-run --locked
          else
            cargo publish --locked
          fi
