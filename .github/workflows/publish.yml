name: publish

# Publishes the `libviprs` crate to crates.io. Ported back to GitHub from
# `.gitea/workflows/publish.yml` as part of dropping Gitea (#585). The job body
# below is the pre-migration GitHub workflow restored as it was, including the
# `permissions: contents: read` line that the Gitea copy had dropped.
#
# !!! ONE DELIBERATE DIFFERENCE: THIS IS MANUAL-ONLY !!!
#
# The original fired automatically on the push that landed a release on the
# `release` branch. That trigger is commented out below rather than restored,
# because re-arming it would be a change in release behaviour smuggled in under a
# CI migration, and #585 says not to do that.
#
# The specific hazard: `CARGO_REGISTRY_TOKEN` is not a repository secret here, but
# this repository belongs to an org whose secrets I cannot read, so I cannot prove
# it is not inherited. Publishing has been dormant on GitHub since #528 moved CI
# away in July. If the token does resolve, restoring the push trigger would turn
# the next merge into `release` into a live upload to crates.io, silently, as a
# side effect of a CI change. Manual dispatch cannot do that by accident, and it
# keeps the `dry_run` toggle, which is how you would want to test this anyway.
#
# To re-arm it, uncomment the two `push` lines, having first confirmed that
# `CARGO_REGISTRY_TOKEN` resolves and that #981 is resolved.
#
# NOTE (issue #981): this job used to die at dependency resolution, because the
# manifest asked `pdfium-render` for a `sync` feature that upstream deleted in
# 0.9.0 and only the fork still carries as a synonym. `cargo publish` resolves
# against crates.io, where a git source does not survive, so it was the one
# resolver that ever saw the mismatch. The manifest now asks for `thread_safe`,
# which both the fork and the registry crate have, and the dry run passes.
#
# Publishing for real is still refused, by the guard step below, and for a
# different reason. Registry `pdfium-render` 0.9.0 through 0.9.3 dropped
# `src/bindings/thread_safe.rs` entirely, so there `thread_safe` is a bare
# `unsafe impl Send + Sync for Pdfium` with no serialisation at all
# (ajrcarey/pdfium-render#262). The fork restores the per-call locking, but the
# published crate cannot carry the fork, so uploading today would hand crates.io
# consumers the unsound wrapper. The published 0.3.1 depends on `^0.8`, where
# the locking bindings still shipped, and stays the newest sound release.
#
# Upstream has reinstated those bindings on master and has said they ship in
# 0.9.4. Raising the `pdfium-render` requirement in `Cargo.toml` from `0.9` to
# `0.9.4` once that release exists clears the guard step on its own.

on:
  # push:
  #   branches: [release]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package + verify only (cargo publish --dry-run), do not upload"
        type: boolean
        default: false

permissions:
  contents: read

# Never run two publishes concurrently; never cancel an in-flight upload.
concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve the crate version
        id: v
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "libviprs") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "libviprs version: $version"

      - name: Skip if this version is already on crates.io
        id: check
        run: |
          version="${{ steps.v.outputs.version }}"
          if curl -sf -H 'User-Agent: libviprs-publish-ci' \
               "https://crates.io/api/v1/crates/libviprs/${version}" \
               | jq -e '.version.num' >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::libviprs ${version} is already published on crates.io — skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Loud refusal, not a silent skip. A dry run still packages and verifies;
      # only a real upload is blocked, and only while the manifest would publish
      # a `pdfium-render` requirement that can resolve to a version with no
      # thread-safe bindings in it. See the NOTE at the top of this file.
      - name: Refuse a real upload while the registry pdfium-render is unsound
        if: steps.check.outputs.already == 'false' && github.event.inputs.dry_run != 'true'
        run: |
          req="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "libviprs") | .dependencies[]
                     | select(.name == "pdfium-render") | .req' | head -1)"
          floor="${req#^}"; floor="${floor#>=}"; floor="${floor%% *}"
          echo "libviprs declares pdfium-render \"$req\" (floor $floor)"
          if [ "$(printf '%s\n0.9.4\n' "$floor" | sort -V | head -1)" = "0.9.4" ]; then
            echo "::notice::Floor is at or above 0.9.4, the release carrying the reinstated per-call locking bindings. Upload allowed."
          else
            echo "::error::Refusing to upload libviprs while it declares pdfium-render \"$req\"."
            echo "Registry pdfium-render 0.9.0 through 0.9.3 ship no thread-safe bindings:"
            echo "there, the thread_safe feature is a bare unsafe impl Send + Sync for Pdfium"
            echo "with no serialisation (ajrcarey/pdfium-render#262). The git-pinned fork fixes"
            echo "that, but a git source does not survive publish, so this upload would hand"
            echo "crates.io consumers the unsound wrapper. Raise the requirement in Cargo.toml"
            echo "to 0.9.4 once upstream releases it, then this step passes. Tracked in #981."
            exit 1
          fi

      - name: Publish to crates.io
        if: steps.check.outputs.already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run — packaging + verifying only."
            cargo publish --dry-run --locked
          else
            cargo publish --locked
          fi
