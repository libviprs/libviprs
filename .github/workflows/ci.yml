name: CI

# The only CI for this repository (issue #585).
#
# Some history, because the trigger block below reads as over-specified without
# it. #528 moved CI onto a self-hosted Gitea Actions runner that reported results
# back here as a `gitea/ci` commit status. That last hop never once worked, so
# pull requests carried no build signal for about a month (#530). #538 restored
# this file as a GitHub-side fallback. #585 drops Gitea altogether, so this is
# now the whole gate: `.gitea/workflows/` and the mirror-relay workflow are gone,
# and the `GH_STATUS_TOKEN` reporting steps that used to bookend the Gitea jobs
# went with them.

on:
  # Branch pushes are what actually carries CI here. This is the fix for the
  # trigger gap in #585, so it is worth spelling out why `pull_request` alone was
  # not enough.
  #
  # GitHub will not start a `pull_request` run while the pull request has a merge
  # conflict. Such a run builds `refs/pull/N/merge`, and that ref cannot be
  # created while the merge fails, so the event is simply dropped: no run, no
  # queued run, no failure, nothing to notice. Every lane in epic #520 appends to
  # `## [Unreleased]` in CHANGELOG.md, so a branch starts conflicting with `main`
  # the moment any other lane merges. That is the normal state here, not the
  # exception.
  #
  # Measured over 2026-08-25, after ci.yml landed on `main`: of the branch pushes
  # that reached a branch with an open PR, every push whose branch merged cleanly
  # into `main` produced a run, and the only two that produced no run at all were
  # the two whose branch conflicted with `main` on CHANGELOG.md (PR #557 at
  # 10:38:53Z, PR #576 at 10:53:47Z). #576 then needed a manual dispatch before
  # anyone was willing to merge it. Draft state, concurrency and cancellation were
  # all ruled out: those same branches got runs while still drafts, and cancelled
  # runs show up in the run list as cancelled rather than as nothing.
  #
  # To re-check this later: the run list for this workflow gives the runs, and
  # `git merge-tree --write-tree <main-at-that-time> <pushed-sha>` replays the
  # merge GitHub could not make. The two that produced nothing were
  # 64d200927c90 and 9e092027d203, both conflicting on CHANGELOG.md.
  #
  # A `push` run builds the branch head. It needs no merge commit, so it is
  # unaffected by whether the PR currently merges.
  push:
    branches: ['**']

  # `synchronize` is deliberately absent. A push to a branch in this repository is
  # already covered above, and adding `synchronize` would run the whole suite
  # twice for every one of those pushes. What is left here are the pull-request
  # transitions that no push accompanies.
  #
  # This is also the only trigger that covers a pull request opened from a fork,
  # where no push ever reaches this repository. A fork PR gets CI when it is
  # opened, reopened or marked ready for review, but not on its later pushes. The
  # repository has no forks today; if that changes, add `synchronize` back and
  # guard the jobs so in-repo branches do not run twice.
  pull_request:
    types: [opened, reopened, ready_for_review]

  workflow_dispatch:

# One group per branch, shared by the push run and any pull_request run for the
# same branch, so a newer push supersedes an older run rather than racing it.
# `main` is excluded: that run is the record of what actually landed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings -W clippy::incompatible_msrv -W deprecated
      - run: cargo clippy --all-targets --features pdfium -- -D warnings -W clippy::incompatible_msrv -W deprecated
      # The object-store-sink module (and its `#[cfg(test)] mod tests`) is
      # feature-gated, so it is invisible to the default clippy/test jobs above.
      # Lint it explicitly so regressions in the sink are caught (issue #382).
      - run: cargo clippy --all-targets --features object-store-sink -- -D warnings -W clippy::incompatible_msrv -W deprecated
      # Same for the SVG rasteriser: `svg` is non-default because it costs 29
      # crates, so the default clippy job never sees `src/svg.rs` at all
      # (issue #502).
      - run: cargo clippy --all-targets --features svg -- -D warnings -W clippy::incompatible_msrv -W deprecated
      # And for JPEG XL: `jxl` is non-default because it costs 21 crates, one
      # of which is `tracing`, so the default clippy job compiles neither
      # `src/jxl.rs`'s real bodies nor its unit tests (issue #500).
      - run: cargo clippy --all-targets --features jxl -- -D warnings -W clippy::incompatible_msrv -W deprecated
      # `s3` is a deprecated alias for `object-store-sink`, retained for consumers
      # that pinned the old feature name. Nothing else in CI exercises it, so a
      # broken alias would go unnoticed; build it explicitly so it keeps resolving.
      - run: cargo build --features s3

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      # The number below is written out four times in this repository and
      # nothing compared the copies, so they drifted: the README badge said
      # 1.97 while the Requirements line further down the same file still said
      # 1.85, a version the crate cannot build on (#608). `cargo check` cannot
      # catch that, because checking with a newer toolchain than you declare is
      # not an error, and neither is a stale sentence in a README. Same guard as
      # libviprs-cli grew in its own bump (libviprs-cli#44), minus the
      # cross-repo comparison: `rust-version` here IS the source of truth that
      # the CLI and the site check themselves against.
      - name: Every MSRV claim agrees
        run: |
          declared=$(grep -m1 -E '^rust-version *= *"' Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/' | cut -d. -f1,2)
          pinned=$(rustc --version | sed -E 's/^rustc ([0-9]+\.[0-9]+).*/\1/')
          advertised=$(grep -oE 'rust-[0-9]+\.[0-9]+%2B|Rust [0-9]+\.[0-9]+\+' README.md \
            | grep -oE '[0-9]+\.[0-9]+' | sort -u | paste -sd/ -)
          labelled=$(grep -oE 'MSRV \([0-9]+\.[0-9]+\)' .github/workflows/ci.yml \
            | grep -oE '[0-9]+\.[0-9]+' | sort -u | paste -sd/ -)
          echo "declared (Cargo.toml): $declared"
          echo "pinned (this job):     $pinned"
          echo "advertised (README):   $advertised"
          echo "job name (ci.yml):     $labelled"
          rc=0
          [ -n "$advertised" ] || { echo "::error::no Rust version found in README.md, so this guard has nothing to compare"; rc=1; }
          [ "$declared" = "$pinned" ] || { echo "::error::this job installs $pinned but Cargo.toml declares rust-version $declared"; rc=1; }
          [ "$declared" = "$advertised" ] || { echo "::error::README advertises Rust $advertised+ but Cargo.toml declares $declared"; rc=1; }
          [ "$declared" = "$labelled" ] || { echo "::error::this job is named MSRV ($labelled) but Cargo.toml declares $declared"; rc=1; }
          exit $rc
      - run: cargo check --all-targets
      - run: cargo check --all-targets --features pdfium
      # The `jxl` tree is the one dependency family in the crate with no
      # `rust-version` anywhere in it, so the MSRV-aware resolver cannot keep
      # it honest and a patch release is free to raise the real floor with
      # nothing to declare it. `Cargo.lock` is not committed, so this job
      # resolves fresh on every push and a family-wide bump goes red here
      # within a day. Without the explicit feature the JXL crates are not in
      # the graph at all and this job would never look at them; see the `jxl`
      # comment in Cargo.toml, which cites this line.
      - run: cargo check --all-targets --features jxl

  docs:
    name: Docs (deny broken and private intra-doc links)
    runs-on: ubuntu-latest
    env:
      # `private_intra_doc_links` is warn-by-default, so public documentation
      # could point at a `pub(crate)` item, rustdoc would drop the link and
      # render it as inert bracketed text on docs.rs, and this job stayed green
      # (issue #697). `tests/doc_link_gate.rs` keeps this line and the
      # `Makefile` mirror of it saying the same thing.
      RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # All features so the gated surface resolves instead of reading as broken
      # links; docs.rs itself builds with `all-features` (issue #146).
      - run: cargo doc --no-deps --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      # The object-store-sink module and its unit tests are feature-gated, so
      # bare `cargo test` never compiles or runs them. Exercise the feature so
      # the sink's tests and doctests actually execute in CI (issue #382).
      - run: cargo test --features object-store-sink
      # The SVG module and its unit tests are behind the non-default `svg`
      # feature, and the `<image xlink:href>` lockdown tests in
      # tests/path_traversal.rs are gated on it too. Bare `cargo test` runs
      # none of them, and the lockdown is a security regression test, so it
      # needs to actually execute (issue #502).
      - run: cargo test --features svg
      # Same for JPEG XL. Bare `cargo test` compiles `src/jxl.rs` with every
      # real body cfg'd out, so the oracle pins, the fuzz-corpus sweep and the
      # `tests/jxl_ported_surface.rs` round trips all run zero assertions
      # against the codec unless the feature is named (issue #500).
      - run: cargo test --features jxl

  integration-test:
    name: Integration Tests (libviprs-tests)
    runs-on: ubuntu-latest
    steps:
      # Check out libviprs at the current branch/PR ref into the "libviprs" subdirectory.
      # libviprs-tests depends on { path = "../libviprs" }, so the two repos must be siblings.
      - uses: actions/checkout@v4
        with:
          path: libviprs
      - name: Clone libviprs-tests (matching branch or main)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "$BRANCH" https://github.com/${{ github.repository_owner }}/libviprs-tests.git libviprs-tests 2>/dev/null \
            || git clone --depth 1 https://github.com/${{ github.repository_owner }}/libviprs-tests.git libviprs-tests
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libviprs-tests
      # Every ported_* cell in libviprs-tests is behind
      # `#![cfg(feature = "ported_tests")]`, so under the plain `cargo test`
      # below they compile to nothing and report `running 0 tests`. That made
      # this job blind to exactly the thing its name promises: a core API
      # change that breaks a ported call site went green. #591 changed
      # `decode_svg` from `Option<f64>` to `SvgOptions` and this job said
      # nothing; #576 moved the `encode_webp` and `encode_gif` signatures and
      # that was caught only because someone went looking (issue #594).
      #
      # `--no-run` is the whole point. Compiling the cells is what catches a
      # signature break, and running them needs the libvips reference fixtures
      # that this runner does not have. It runs before the suite because it is
      # the cheap half, so a break in the ported surface shows up as the first
      # failure in the log rather than after a full test run.
      #
      # Note this checks the cells against libviprs at *this* ref, which is not
      # what libviprs-tests' own CI does: that builds them against the core
      # pinned in its COUNTERPART_REV. The two together are what covers the
      # gap, and neither one alone does.
      - name: Compile the feature-gated ported cells
        working-directory: libviprs-tests
        run: cargo test --features ported_tests --no-run
      - name: Run integration tests
        working-directory: libviprs-tests
        run: cargo test
      # Compile and run the feature-gated object-store sink integration tests
      # (the S3 leg of phase3 and the stub-contract test) so they are not
      # silently excluded from CI (issue #382).
      - name: Run object-store sink integration tests
        working-directory: libviprs-tests
        run: cargo test --features object-store-sink
