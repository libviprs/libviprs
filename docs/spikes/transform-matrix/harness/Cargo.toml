# Throwaway measurement harness for N1.5 (#1044). Not a member of any libviprs workspace: the empty
# [workspace] table below keeps it out of the crate's lockfile and dependency policy.
#
# It pushes fixtures through PVec's own transform entry point (pvec-geometry, P3.8) and prints one
# record per (fixture, transform). PVec is staged next to this crate by run.sh from a pinned
# revision, so nothing here reads a tolerance from anywhere but pvec-numeric.
[package]
name = "transform-matrix-harness"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
pvec-geometry = { path = "../pvec-src/crates/pvec-geometry" }
pvec-numeric = { path = "../pvec-src/crates/pvec-numeric" }
